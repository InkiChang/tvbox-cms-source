name: Sync Upstream CMS Source

on:
  schedule:
    - cron: '30 17 * * *'  # UTC 17:30 = 北京时间每日 01:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch upstream source.json
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            "https://raw.githubusercontent.com/krypth/tvbox-cms-source/main/source.json" \
            -o upstream.json
          python3 -c "import json; json.load(open('upstream.json'))"

      - name: Update source.json if changed
        run: |
          if cmp -s upstream.json source.json; then
            echo "Upstream unchanged, skip."
          else
            cp upstream.json source.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add source.json
            git commit -m "chore: sync upstream source $(date -u +%F)"
            git push
          fi
