name: Build CMS Subscription

on:
  schedule:
    - cron: "30 17 * * *"  # UTC 17:30 = 北京时间 01:30
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-subscription
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build source.json (merge upstreams, dedupe)
        run: python3 tools/build_source.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: rebuild subscription $(date -u +%Y-%m-%d)"
            git push
          fi
